site_name: Liminal Technical Writing Portfolio & Documentation Portal
site_description: Complete Technical Writer Assignment submission for Liminal, featuring API documentation updates, UX guide audit & rewrite, RESTful API redesign, and work samples.
site_author: Technical Writer Candidate
site_url: https://rajwar88.github.io/Assign/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Assignment Tasks:
      - "Q1: API Endpoint Update (Cube3)": q1-api-documentation.md
      - "Q2: Solana Staking Guide Audit": q2-solana-staking-guide.md
      - "Q3: RESTful API Redesign":
          - "Architectural Overview & OpenAPI": q3-rest-api-redesign.md
          - "Q3.1: GET /v2/transfers": q3-1-get-transfers.md
          - "Q3.2: POST /v2/transfers/batch": q3-2-send-transactions.md
          - "Q3.3: GET /v2/wallets/{id}/balances": q3-3-get-balances.md
      - "Q4: Work Samples & Portfolio": q4-portfolio-samples.md
